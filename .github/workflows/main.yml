name: Leila-signal-Pro

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت اجرا میشه
  workflow_dispatch:       # امکان اجرای دستی هم داری

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          OUTPUT_DIR: output
          MIN_SIGNAL_CONFIDENCE: 40
          STRONG_SIGNAL_THRESHOLD: 70
          WEAK_SIGNAL_MAX: 39
          EMAIL_ENABLED: false
          SMS_ENABLED: true
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_RECEIVERS: ${{ secrets.SMS_RECEIVERS }}
        run: |
          python korosh.py
